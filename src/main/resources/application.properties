spring.application.name=EcoFlux
spring.profiles.default=dev
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.time-zone=America/Sao_Paulo
spring.data.web.pageable.max-page-size=100
server.error.include-message=never
server.error.include-stacktrace=never
server.port=${PORT:8080}
api.security.token.expiration-hours=2
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8550}
app.security.auth-limit=${AUTH_RATE_LIMIT:30}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
