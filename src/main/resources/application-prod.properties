spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecoflux?serverTimezone=UTC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.locations=classpath:db/migration,classpath:db/migration-mysql
api.security.token.secret=${JWT_SECRET}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
